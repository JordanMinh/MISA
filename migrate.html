<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MISA Data Migration</title><link rel="stylesheet" href="style.css"><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script src="config.js"></script><script src="misa-core.js"></script></head><body><main class="page-shell"><h1 class="page-title">MISA Data Migration</h1><p class="page-subtitle">Import Supabase products and migrate their images to Cloudinary.</p><section class="upload-form"><p>Export the products table from Supabase as CSV or JSON, then select it here. Existing product IDs are preserved. Image URLs are copied to Cloudinary before Firestore is updated.</p><label>Supabase products export<input id="migrationFile" type="file" accept=".csv,.json,application/json,text/csv"></label><button class="submit-btn" id="startMigration">Start migration</button><p id="migrationStatus" class="form-note" aria-live="polite"></p><pre id="migrationLog" style="white-space:pre-wrap;max-height:360px;overflow:auto"></pre><p><a href="upload.html">Back to Admin</a></p></section></main><script src="migrate.js"></script></body></html>
