<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - MISA</title>
    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="misa-core.js"></script>\n    <script src="script.js"></script>
    <script src="upload.js"></script>
</head>
<body>
    <div class="page-shell">

        <!-- Shared navigation bar, identical to index.html.
             choose4 is checked because this is the corresponding page. -->
        <div id="navbody">
            <form action="#">
                <ul class="ul">
                    <input name="rad" class="radio" id="choose1" type="radio" />
                    <label for="choose1">
                        <li class="li">
                            <svg viewBox="0 0 24 24" fill="none" height="24" width="24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" class="svg w-6 h-6 text-gray-800 dark:text-white">
                                <path d="m4 12 8-8 8 8M6 10.5V19a1 1 0 0 0 1 1h3v-3a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v3h3a1 1 0 0 0 1-1v-8.5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke="currentColor"></path>
                            </svg>
                        </li>
                    </label>

                    <input class="radio" name="rad" id="choose2" type="radio" />
                    <label for="choose2">
                        <li class="li">
                            <svg viewBox="0 0 24 24" fill="none" height="24" width="24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" class="svg w-6 h-6 text-gray-800 dark:text-white">
                                <path d="m21 21-3.5-3.5M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z" stroke-width="2" stroke-linecap="round" stroke="currentColor"></path>
                            </svg>
                        </li>
                    </label>

                    <input class="radio" name="rad" id="choose3" type="radio" />
                    <label for="choose3">
                        <li class="li">
                            <svg viewBox="0 0 24 24" fill="none" height="24" width="24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" class="svg w-6 h-6 text-gray-800 dark:text-white">
                                <path d="m17 21-5-4-5 4V3.889a.92.92 0 0 1 .244-.629.808.808 0 0 1 .59-.26h8.333a.81.81 0 0 1 .589.26.92.92 0 0 1 .244.63V21Z" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke="currentColor"></path>
                            </svg>
                        </li>
                    </label>

                    <input checked="" class="radio" name="rad" id="choose4" type="radio" />
                    <label for="choose4">
                        <li class="li">
                            <svg viewBox="0 0 24 24" fill="none" height="24" width="24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" class="svg w-6 h-6 text-gray-800 dark:text-white">
                                <path d="M10 19H5a1 1 0 0 1-1-1v-1a3 3 0 0 1 3-3h2m10 1a3 3 0 0 1-3 3m3-3a3 3 0 0 0-3-3m3 3h1m-4 3a3 3 0 0 1-3-3m3 3v1m-3-4a3 3 0 0 1 3-3m-3 3h-1m4-3v-1m-2.121 1.879-.707-.707m5.656 5.656-.707-.707m-4.242 0-.707.707m5.656-5.656-.707.707M12 8a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" stroke-width="2" stroke-linejoin="round" stroke-linecap="square" stroke="currentColor"></path>
                            </svg>
                        </li>
                    </label>
                </ul>
            </form>
        </div>

        <h1 class="page-title">Admin Dashboard</h1>
        <p class="page-subtitle">Post new products and manage all posted products</p>

        <form class="upload-form" id="productForm">
            <h2 class="form-heading" id="formHeading">Post a New Product</h2>
            <label>
                Product Name
                <input type="text" id="pName" placeholder="Example: Cotton T-shirt" required>
            </label>

            <label>
                Price (USD)
                <input type="number" id="pPrice" placeholder="Example: 9.99" min="0" step="0.01" required>
            </label>

            <label>
                Category
                <select id="pCategory">
                    <option value="Fashion">Fashion</option>
                    <option value="Electronics">Electronics</option>
                    <option value="Home & Kitchen">Home & Kitchen</option>
                    <option value="Beauty">Beauty</option>
                    <option value="Other" selected>Other</option>
                </select>
            </label>

            <label>
                Description
                <textarea id="pDesc" placeholder="Material, size, condition..."></textarea>
            </label>

            <label>
                Original product link (optional)
                <input type="text" id="pLink" placeholder="Example: https://shopee.vn/...">
            </label>

            <label>
                Product Image
                <div class="image-drop" id="imageDrop">
                    <span id="dropHint">Click to choose an image (or drag and drop)</span>
                    <input type="file" id="pImage" accept="image/*">
                </div>
            </label>

            <div class="form-btn-row">
                <button type="submit" class="submit-btn" id="submitBtn">Post Product</button>
                <button type="button" class="cancel-edit-btn" id="cancelEditBtn" hidden>Cancel Edit</button>
            </div>
            <p class="form-note" id="formNote">The product will appear in the management list below.</p>
        </form>

        <section class="admin-manage">
            <div class="manage-header">
                <h2 class="manage-title">Manage Posted Products</h2>
                <div class="manage-toolbar">
                    <input type="text" id="adminSearchInput" class="admin-search-input" placeholder="Search by product name...">
                    <div class="category-filter" id="adminCategoryFilter"></div>
                </div>
            </div>

            <div class="admin-table" id="adminTable">
                <div class="admin-row admin-row-head">
                    <div class="col-img">Image</div>
                    <div class="col-name">Product Name</div>
                    <div class="col-price">Price</div>
                    <div class="col-cat">Category</div>
                    <div class="col-status">Status</div>
                    <div class="col-actions">Actions</div>
                </div>
                <div id="adminTableBody"></div>
            </div>
        </section>
    </div>

</body>
</html>
