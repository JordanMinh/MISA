<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Account - MISA</title><link rel="stylesheet" href="style.css"><link rel="icon" type="image/svg+xml" href="src/homepage/misa-mark.svg"><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script src="config.js"></script><script src="misa-core.js"></script></head>
<body><main class="page-shell" style="max-width:520px"><h1 class="page-title" id="formTitle">Admin Login</h1><p class="page-subtitle" id="formSubtitle">Sign in to manage MISA products.</p><form id="accountForm" class="upload-form"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" minlength="6" required></label><button class="submit-btn" type="submit" id="submitBtn">Sign in</button><p id="accountMessage" class="form-note" role="status"></p></form><p style="text-align:center;margin-top:18px"><button type="button" class="row-btn" id="toggleMode">Create a customer account</button></p><p style="text-align:center;margin-top:12px"><a href="index.html">Back to MISA</a></p></main><script>
let mode='login';const form=document.getElementById('accountForm'),msg=document.getElementById('accountMessage'),toggle=document.getElementById('toggleMode');toggle.onclick=()=>{mode=mode==='login'?'signup':'login';document.getElementById('formTitle').textContent=mode==='login'?'Admin Login':'Create Account';document.getElementById('formSubtitle').textContent=mode==='login'?'Sign in to manage MISA products.':'Create a customer account for MISA.';document.getElementById('submitBtn').textContent=mode==='login'?'Sign in':'Create account';toggle.textContent=mode==='login'?'Create a customer account':'Back to sign in';msg.textContent='';};form.addEventListener('submit',async e=>{e.preventDefault();const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;const btn=document.getElementById('submitBtn');btn.disabled=true;msg.textContent=mode==='login'?'Signing in...':'Creating account...';try{if(mode==='signup'){const cred=await MISA.auth.createUserWithEmailAndPassword(email,password);await MISA.db.collection('users').doc(cred.user.uid).set({email,created_at:new Date().toISOString()});msg.textContent='Account created. Copy this account UID from Firebase Authentication → Users, then create admins/{UID} in Firestore with role = admin. After that, sign in here.';mode='login';document.getElementById('formTitle').textContent='Admin Login';document.getElementById('submitBtn').textContent='Sign in';toggle.textContent='Create a customer account';return;}await MISA.auth.signInWithEmailAndPassword(email,password);if(await MISA.isAdmin()){location.replace('upload.html');}else{msg.textContent='Signed in successfully. This account is not an Admin account.';location.replace('index.html');}}catch(err){msg.textContent=err.message||'Unable to authenticate.';}finally{btn.disabled=false;}});
</script></body></html>
